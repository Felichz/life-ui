name: Release

# Builds the desktop app for Windows, macOS and Linux and attaches it to one
# GitHub release. Push a tag like v0.2.0 (the version in src-tauri/tauri.conf.json
# and src-tauri/Cargo.toml) to make one:
#   git tag v0.2.0 && git push origin v0.2.0
# The release is created as a draft: review it on GitHub and publish it, and
# https://github.com/Felichz/life-ui/releases/latest (the site's download button) points at it.
#
# What each system gets:
#   Windows  LifeUI_<v>_x64-setup.exe (installer, no admin needed), LifeUI_<v>_x64_en-US.msi,
#            LifeUI_<v>_x64_portable.zip (LifeUI.exe and its LifeUI-data folder: nothing installed)
#   macOS    LifeUI_<v>_universal.dmg (Apple silicon and Intel)
#   Linux    .AppImage, .deb and .rpm (x86_64)
# The builds are not signed with a paid certificate: Windows SmartScreen and macOS
# Gatekeeper ask once before the first launch (the README says how to get past it).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "LifeUI v__VERSION__"
          releaseBody: |
            The desktop app of LifeUI: the conversation with the coach in the middle, the day beside it. It runs the coach on a local model (LM Studio or Ollama).

            **Windows:** `-setup.exe` installs it for you (no admin needed); the `.msi` is for managed installs; `_portable.zip` runs from any folder and keeps its data in the `LifeUI-data` folder beside it.
            **macOS:** the `.dmg` runs on Apple silicon and Intel.
            **Linux:** `.AppImage` runs anywhere; `.deb` and `.rpm` install it.

            The builds are not signed with a paid certificate. On Windows, SmartScreen may say "Windows protected your PC": More info, then Run anyway. On macOS, right-click the app, Open, then Open again.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # The portable copy: the same program, with the data folder that keeps everything beside it
      - name: Windows portable
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          name="LifeUI_${VERSION}_x64_portable"
          mkdir -p "$name/LifeUI-data"
          cp src-tauri/target/release/lifeui.exe "$name/LifeUI.exe"
          printf '%s\r\n' \
            "LifeUI ${VERSION}, portable." \
            "" \
            "Run LifeUI.exe. Nothing is installed: the app keeps its data (the day, the library," \
            "the conversations) in the LifeUI-data folder next to it. Move the whole folder to" \
            "take it elsewhere; delete it to remove everything." \
            "" \
            "It needs Microsoft Edge WebView2, which Windows 10 and 11 already have." \
            "https://github.com/Felichz/life-ui" > "$name/README.txt"
          7z a "$name.zip" "$name" > /dev/null
          curl --fail -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @"$name.zip" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=$name.zip"
