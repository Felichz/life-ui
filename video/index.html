<!doctype html>
<html
  lang="en"
  data-theme="light"
  data-composition-variables='[{"id":"theme","type":"enum","label":"Theme","default":"light","options":[{"value":"light","label":"Light"},{"value":"dark","label":"Dark"}]}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1200" />
    <title>LifeUI: a day in forty seconds</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- The app's own built CSS (tools/build.mjs), then the film's layer -->
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="stylesheet" href="assets/film.css" />
    <script src="assets/rects.js"></script>
    <script src="assets/film.js"></script>
    <script>
      // The edition: the app's tokens switch on <html data-theme> (each scene applies the variable)
      FILM.theme();
    </script>
  </head>
  <body>
    <div
      id="film"
      data-composition-id="main"
      data-start="0"
      data-duration="38.9"
      data-width="1920"
      data-height="1200"
    >
      <div
        id="start"
        class="clip"
        data-composition-id="start"
        data-composition-src="compositions/start.html"
        data-start="0"
        data-duration="2.1"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1200"
      ></div>
      <div
        id="plan"
        class="clip"
        data-composition-id="plan"
        data-composition-src="compositions/plan.html"
        data-start="2.1"
        data-duration="5.2"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1200"
      ></div>
      <div
        id="morning"
        class="clip"
        data-composition-id="morning"
        data-composition-src="compositions/morning.html"
        data-start="7.3"
        data-duration="6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1200"
      ></div>
      <div
        id="close"
        class="clip"
        data-composition-id="close"
        data-composition-src="compositions/close.html"
        data-start="13.3"
        data-duration="10"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1200"
      ></div>
      <div
        id="earned"
        class="clip"
        data-composition-id="earned"
        data-composition-src="compositions/earned.html"
        data-start="23.3"
        data-duration="5.6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1200"
      ></div>
      <div
        id="review"
        class="clip"
        data-composition-id="review"
        data-composition-src="compositions/review.html"
        data-start="28.9"
        data-duration="5.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1200"
      ></div>
      <div
        id="end"
        class="clip"
        data-composition-id="end"
        data-composition-src="compositions/end.html"
        data-start="34.4"
        data-duration="4.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1200"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      FILM.theme();
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
