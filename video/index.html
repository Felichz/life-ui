<!doctype html>
<html
  lang="en"
  data-theme="light"
  data-composition-variables='[{"id":"theme","type":"enum","label":"Theme","default":"light","options":[{"value":"light","label":"Light"},{"value":"dark","label":"Dark"}]}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1200" />
    <title>LifeUI: from the chat to the calendar</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- The app's own built CSS (tools/build.mjs), then the film's layer -->
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="stylesheet" href="assets/film.css" />
    <script src="assets/rects.js"></script>
    <script src="assets/film.js"></script>
    <script>
      // The edition: the app's tokens switch on <html data-theme> (each scene applies the variable)
      FILM.theme();
    </script>
  </head>
  <body>
    <div
      id="film"
      data-composition-id="main"
      data-start="0"
      data-duration="44.5"
      data-width="1920"
      data-height="1200"
    >
      <div
        id="ask"
        class="clip"
        data-composition-id="ask"
        data-composition-src="compositions/ask.html"
        data-start="0"
        data-duration="6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1200"
      ></div>
      <div
        id="answer"
        class="clip"
        data-composition-id="answer"
        data-composition-src="compositions/answer.html"
        data-start="6"
        data-duration="8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1200"
      ></div>
      <div
        id="card"
        class="clip"
        data-composition-id="card"
        data-composition-src="compositions/card.html"
        data-start="14"
        data-duration="6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1200"
      ></div>
      <div
        id="saved"
        class="clip"
        data-composition-id="saved"
        data-composition-src="compositions/saved.html"
        data-start="20"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1200"
      ></div>
      <div
        id="goals"
        class="clip"
        data-composition-id="goals"
        data-composition-src="compositions/goals.html"
        data-start="24"
        data-duration="7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1200"
      ></div>
      <div
        id="run"
        class="clip"
        data-composition-id="run"
        data-composition-src="compositions/run.html"
        data-start="31"
        data-duration="5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1200"
      ></div>
      <div
        id="close"
        class="clip"
        data-composition-id="close"
        data-composition-src="compositions/close.html"
        data-start="36"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1200"
      ></div>
      <div
        id="end"
        class="clip"
        data-composition-id="end"
        data-composition-src="compositions/end.html"
        data-start="40"
        data-duration="4.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1200"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      FILM.theme();
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
