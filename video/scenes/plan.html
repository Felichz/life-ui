<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
      </style>
      <div id="plan" data-composition-id="plan" data-width="1920" data-height="1200">
        <div class="f-win">
          <div id="plan-cam" class="f-cam">
            <!-- snap:02-plan -->
          </div>
        </div>
        <p id="plan-cap1" class="f-cap">
          <span>Plan the day <em>in time blocks</em></span>
        </p>
        <p id="plan-cap2" class="f-cap">
          <span>Later blocks <em>open at their hour</em></span>
        </p>
        <div id="plan-click" class="f-click"></div>
        <div id="plan-cursor" class="f-cursor">
          <svg viewBox="0 0 28 28" width="56" height="56" aria-hidden="true">
            <path
              d="M4 3l17 9.5-7.4 1.6L10 21.6z"
              fill="#fff"
              stroke="#16161a"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </div>
      <script>
        (() => {
          const F = FILM;
          F.theme();
          const $ = (s) => document.querySelector(s);
          const tl = gsap.timeline({ paused: true });
          const cam = $("#plan-cam");
          const plan = F.r("02-plan", "plan");
          const evening = F.r("02-plan", "evening");
          const locks = [F.r("02-plan", "locks", 0), F.r("02-plan", "locks", 1)];
          const rows = {
            x: plan.x,
            y: evening.y - 8,
            w: plan.w,
            h: locks[1].y + locks[1].h + 12 - evening.y,
          };
          const v1 = F.view(plan, 1.9, 0.5, 0.42);
          const v2 = F.view(rows, 2.5, 0.5, 0.42);
          tl.set(cam, F.home, 0);
          F.cap(tl, "#plan-cap1", 0.3, 2.3);
          F.move(tl, cam, v1, 0.3, 0.7);
          F.move(tl, cam, v2, 2.3, 0.6);
          F.cap(tl, "#plan-cap2", 2.7);
          const p = F.aim(v2, locks[0]);
          tl.fromTo(
            "#plan-cursor",
            { x: 1960, y: 1100 },
            { x: p.x, y: p.y, duration: 0.8, ease: "power2.inOut" },
            3.0
          );
          window.__timelines["plan"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
