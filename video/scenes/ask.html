<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
      </style>
      <div id="ask" data-composition-id="ask" data-width="1920" data-height="1200">
        <div class="f-win">
          <div id="ask-cam" class="f-cam">
            <!-- snap:c01-ask -->
          </div>
        </div>
        <p id="ask-cap1" class="f-cap">
          <span>Tell it <em>what is going on</em></span>
        </p>
        <div id="ask-click" class="f-click"></div>
        <div id="ask-cursor" class="f-cursor">
          <svg viewBox="0 0 28 28" width="56" height="56" aria-hidden="true">
            <path
              d="M4 3l17 9.5-7.4 1.6L10 21.6z"
              fill="#fff"
              stroke="#16161a"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </div>
      <script>
        (() => {
          const F = FILM;
          F.theme();
          const tl = gsap.timeline({ paused: true });
          const cam = document.querySelector("#ask-cam");
          const snaps = [...document.querySelectorAll("#ask-cam .snap")];
          if (snaps.length > 1) tl.set(snaps.slice(1), { opacity: 0 }, 0);
          const [s] = snaps;
          F.chat(tl, s, "c01-ask");
          const input = F.r("c01-ask", "input");
          const send = F.r("c01-ask", "send");
          const vInput = F.view({ x: input.x, y: input.y - 60, w: input.w, h: input.h + 60 }, 2.3, 0.5, 0.45);
          tl.set(cam, F.home, 0);
          F.cap(tl, "#ask-cap1", 0.4, 5.2);
          F.move(tl, cam, vInput, 0.8, 0.7);
          F.typeIn(tl, s, 1.5, 2.2);
          const pSend = F.aim(vInput, send, 0.5, 0.55);
          tl.fromTo("#ask-cursor", { x: 1960, y: 1240 }, { x: pSend.x, y: pSend.y, duration: 0.9, ease: "power2.inOut" }, 3.9);
          F.click(tl, "#ask-cursor", "#ask-click", pSend, 5.3);
          tl.to("#ask-cursor", { opacity: 0, duration: 0.2 }, 5.6);
          window.__timelines["ask"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
