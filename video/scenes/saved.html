<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
      </style>
      <div id="saved" data-composition-id="saved" data-width="1920" data-height="1200">
        <div class="f-win">
          <div id="saved-cam" class="f-cam">
            <!-- snap:c04-saved -->
          </div>
        </div>
        <p id="saved-cap1" class="f-cap">
          <span><em>50 sessions</em> on your calendar</span>
        </p>

      </div>
      <script>
        (() => {
          const F = FILM;
          F.theme();
          const tl = gsap.timeline({ paused: true });
          const cam = document.querySelector("#saved-cam");
          const snaps = [...document.querySelectorAll("#saved-cam .snap")];
          if (snaps.length > 1) tl.set(snaps.slice(1), { opacity: 0 }, 0);
          const [s] = snaps;
          F.chat(tl, s, "c04-saved");
          const list = F.r("c04-saved", "list");
          const vEnd = F.view({ x: list.x, y: list.y + list.h - 400, w: list.w, h: 400 }, 2.25, 0.5, 0.45);
          tl.set(cam, vEnd, 0);
          F.cap(tl, "#saved-cap1", 0.4, 3.6);
          window.__timelines["saved"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
