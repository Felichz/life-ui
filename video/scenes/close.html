<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
      </style>
      <div id="close" data-composition-id="close" data-width="1920" data-height="1200">
        <div class="f-win">
          <div id="close-cam" class="f-cam">
            <!-- snap:c08-close -->
            <!-- snap:c09-earned -->
          </div>
        </div>
        <p id="close-cap1" class="f-cap">
          <span>Closed honestly, <em>in a sentence</em></span>
        </p>
        <div id="close-click" class="f-click"></div>
        <div id="close-cursor" class="f-cursor">
          <svg viewBox="0 0 28 28" width="56" height="56" aria-hidden="true">
            <path
              d="M4 3l17 9.5-7.4 1.6L10 21.6z"
              fill="#fff"
              stroke="#16161a"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </div>
      <script>
        (() => {
          const F = FILM;
          F.theme();
          const tl = gsap.timeline({ paused: true });
          const cam = document.querySelector("#close-cam");
          const snaps = [...document.querySelectorAll("#close-cam .snap")];
          if (snaps.length > 1) tl.set(snaps.slice(1), { opacity: 0 }, 0);
          const [waiting, done] = snaps;
          F.chat(tl, waiting, "c08-close");
          F.chat(tl, done, "c09-earned");
          const doit = F.r("c08-close", "doit");
          const vCard = F.view({ x: 1029, y: doit.y - 260, w: 411, h: 300 }, 2.25, 0.5, 0.45);
          tl.set(cam, vCard, 0);
          F.cap(tl, "#close-cap1", 0.3);
          const pDo = F.aim(vCard, doit, 0.5, 0.55);
          tl.fromTo("#close-cursor", { x: 1960, y: 1240 }, { x: pDo.x, y: pDo.y, duration: 0.9, ease: "power2.inOut" }, 0.5);
          F.click(tl, "#close-cursor", "#close-click", pDo, 1.6);
          tl.set(done, { opacity: 1 }, 1.68);
          tl.to("#close-cursor", { opacity: 0, duration: 0.2 }, 1.9);
          F.move(tl, cam, F.home, 2.2, 0.7);
          window.__timelines["close"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
