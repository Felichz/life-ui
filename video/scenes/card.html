<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
      </style>
      <div id="card" data-composition-id="card" data-width="1920" data-height="1200">
        <div class="f-win">
          <div id="card-cam" class="f-cam">
            <!-- snap:c03-card -->
          </div>
        </div>
        <p id="card-cap1" class="f-cap">
          <span>Nothing changes <em>without your yes</em></span>
        </p>
        <div id="card-click" class="f-click"></div>
        <div id="card-cursor" class="f-cursor">
          <svg viewBox="0 0 28 28" width="56" height="56" aria-hidden="true">
            <path
              d="M4 3l17 9.5-7.4 1.6L10 21.6z"
              fill="#fff"
              stroke="#16161a"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </div>
      <script>
        (() => {
          const F = FILM;
          F.theme();
          const tl = gsap.timeline({ paused: true });
          const cam = document.querySelector("#card-cam");
          const snaps = [...document.querySelectorAll("#card-cam .snap")];
          if (snaps.length > 1) tl.set(snaps.slice(1), { opacity: 0 }, 0);
          const [s] = snaps;
          F.chat(tl, s, "c03-card");
          const doit = F.r("c03-card", "doit");
          const vCard = F.view({ x: 1040, y: doit.y - 300, w: 400, h: 340 }, 2.25, 0.5, 0.45);
          tl.set(cam, vCard, 0);
          F.cap(tl, "#card-cap1", 0.5, 5.6);
          const pDo = F.aim(vCard, doit, 0.5, 0.55);
          tl.fromTo("#card-cursor", { x: 1960, y: 1240 }, { x: pDo.x, y: pDo.y, duration: 1.0, ease: "power2.inOut" }, 2.6);
          F.click(tl, "#card-cursor", "#card-click", pDo, 4.4);
          window.__timelines["card"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
