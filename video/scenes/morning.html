<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
      </style>
      <div id="morning" data-composition-id="morning" data-width="1920" data-height="1200">
        <div class="f-win">
          <div id="morning-cam" class="f-cam">
            <!-- snap:03-meditate -->
            <!-- snap:04-morning -->
          </div>
        </div>
        <p id="morning-cap1" class="f-cap">
          <span><em>One thing</em> at a time</span>
        </p>
        <p id="morning-cap2" class="f-cap">
          <span>Each close <em>lands in the log</em></span>
        </p>
      </div>
      <script>
        (() => {
          const F = FILM;
          F.theme();
          const $ = (s) => document.querySelector(s);
          const tl = gsap.timeline({ paused: true });
          const cam = $("#morning-cam");
          const [first, second] = document.querySelectorAll("#morning-cam .snap");
          const card = F.r("03-meditate", "card");
          const log = F.r("04-morning", "log");
          tl.set(cam, F.home, 0);
          tl.set(second, { opacity: 0 }, 0);
          F.cap(tl, "#morning-cap1", 0.2, 2.6);
          F.move(tl, cam, F.view(card, 1.9, 0.5, 0.42), 0.2, 0.6);
          tl.to(second, { opacity: 1, duration: 0.3, ease: "none" }, 2.8);
          F.move(tl, cam, F.view(log, 2.5, 0.5, 0.42), 2.8, 0.6);
          F.cap(tl, "#morning-cap2", 3.3);
          window.__timelines["morning"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
