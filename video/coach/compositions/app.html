es NHS patient leaflet”</span><span class="mt-1 flex flex-col gap-0.5"><a href="https://www.ouh.nhs.uk/media/lsjlro5o/85220advice.pdf" target="_blank" rel="noreferrer" class="truncate text-xs text-ink-2 underline decoration-line-strong underline-offset-2 hover:text-ink" id="src-0">Tennis elbow: advice and exercises (Oxford University Hospitals, NHS)<span class="text-ink-3"> · ouh.nhs.uk</span></a><a href="https://www.plymouthhospitals.nhs.uk/display-pil/pil-tennis-elbow-4079" target="_blank" rel="noreferrer" class="truncate text-xs text-ink-2 underline decoration-line-strong underline-offset-2 hover:text-ink" id="src-1">Tennis elbow (University Hospitals Plymouth, NHS)<span class="text-ink-3"> · plymouthhospitals.nhs.uk</span></a><a href="https://rightdecisions.scot.nhs.uk/media/je5g5qzk/tennis-elbow-exercise-booklet.pdf" target="_blank" rel="noreferrer" class="truncate text-xs text-ink-2 underline decoration-line-strong underline-offset-2 hover:text-ink" id="src-2">Tennis elbow exercise booklet (NHS Right Decisions)<span class="text-ink-3"> · rightdecisions.scot.nhs.uk</span></a><a href="https://osha.gov/etools/computer-workstations/additional-information" target="_blank" rel="noreferrer" class="truncate text-xs text-ink-2 underline decoration-line-strong underline-offset-2 hover:text-ink" id="src-3">Computer workstations (OSHA)<span class="text-ink-3"> · osha.gov</span></a></span></span></li></ul><div class="group/message flex flex-col gap-1 pr-2 leading-6 text-ink" id="m-answer"><div class="text-base leading-relaxed text-ink"><p class="[&amp;:not(:first-child)]:mt-2">I'm not a doctor and this isn't a diagnosis, but pain on the outside of the elbow of the mouse arm is the classic overload pattern, and the NHS guides agree on what helps.</p>
<p class="[&amp;:not(:first-child)]:mt-2"><strong class="font-semibold text-ink">Change today:</strong> elbow near 90°, the mouse close, the Mac raised with an external keyboard and mouse, a short break every 30 to 45 minutes.</p>
<p class="[&amp;:not(:first-child)]:mt-2"><strong class="font-semibold text-ink">A 10-week plan, about 10 minutes a session</strong> (most people improve in 8 to 12 weeks):</p>
<ol class="mt-2 list-decimal space-y-1 pl-5 marker:text-ink-3">
<li class="pl-0.5"><strong class="font-semibold text-ink">Weeks 1–2, calm it down:</strong> isometric wrist hold 5 × 30 s, forearm stretch 3 × 10 s.</li>
<li class="pl-0.5"><strong class="font-semibold text-ink">Weeks 3–6, load it:</strong> eccentric wrist extension 3 × 15 with a 0.5 L bottle.</li>
<li class="pl-0.5"><strong class="font-semibold text-ink">Weeks 7–10, make it strong:</strong> the same with 1–2 kg, plus grip 3 × 10.</li>
</ol>
<p class="[&amp;:not(:first-child)]:mt-2">Every session will carry the link to the guide that shows its exercises. See a physio first if you have tingling, pain at night or swelling.</p>
<p class="[&amp;:not(:first-child)]:mt-2">Which days, and at what time?</p></div><div class="flex h-6 items-center gap-0.5 transition-opacity duration-150 focus-within:opacity-100 group-hover/message:opacity-100 coarse:opacity-100 opacity-0 -ml-1.5 justify-start"><button type="button" aria-label="Copy" class="flex size-6 items-center justify-center rounded text-ink-3 transition-colors duration-150 hover:bg-hover hover:text-ink coarse:size-9 [&amp;_svg]:size-3.5" data-state="closed"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg></button><button type="button" aria-label="Continue from here in another conversation" class="flex size-6 items-center justify-center rounded text-ink-3 transition-colors duration-150 hover:bg-hover hover:text-ink coarse:size-9 [&amp;_svg]:size-3.5" data-state="closed"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-git-branch"><line x1="6" x2="6" y1="3" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg></button></div></div><div class="group/message mt-3 flex flex-col items-end gap-1 first:mt-0" id="m-reply"><div class="max-w-[88%] rounded-lg rounded-br-sm bg-hover px-3.5 py-2 text-md text-ink"><p class="whitespace-pre-wrap">Weekdays at 9, before work. No tingling. Go ahead.</p></div><div class="flex h-6 items-center gap-0.5 transition-opacity duration-150 focus-within:opacity-100 group-hover/message:opacity-100 coarse:opacity-100 opacity-0 justify-end"><button type="button" aria-label="Copy" class="flex size-6 i           sw[2].style.height = tall[2] + 'px';
          const sb = box(scroller);
          const floor = sb.y + sb.h - 28; // the list's bottom padding
          const feedTop = box(feed).y;
          /** Bottom of an element in the feed, with the two cards at the heights given (0 = still waiting). */
          const bottomOf = (el, closed = 0) => {
            sw[1].style.height = (closed >= 1 ? short[1] : tall[1]) + 'px';
            sw[2].style.height = (closed >= 2 ? short[2] : tall[2]) + 'px';
            const b = box(el);
            sw[1].style.height = tall[1] + 'px';
            sw[2].style.height = tall[2] + 'px';
            return b.y + b.h;
          };
          const need = (bottom) => Math.max(0, bottom - floor);
          const scroll = { y: 0 };
          let scrolled = 0;
          const paintScroll = () => (feed.style.transform = `translateY(${-scroll.y}px)`);
          const scrollTo = (t, y, d = 0.5, ease = 'power3.out') => {
            if (Math.abs(y - scrolled) < 0.5) return;
            tl.fromTo(scroll, { y: scrolled }, { y, duration: d, ease, onUpdate: paintScroll, ...IR }, t);
            scrolled = y;
          };
          /** Where an element of the feed is on screen once the feed has scrolled by `y`. */
          const inChat = (el, y, closed = 0) => {
            sw[1].style.height = (closed >= 1 ? short[1] : tall[1]) + 'px';
            const b = box(el);
            sw[1].style.height = tall[1] + 'px';
            return { ...b, y: b.y - y };
          };
          /** An entry joins the chat: it rises into place while the list scrolls to keep it in view. */
          const join = (el, t, closed = 0) => {
            scrollTo(t, need(bottomOf(el, closed)));
            tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.42, ease: 'power3.out', ...IR }, t + 0.04);
          };

          // ---------- the composer: typed, then sent
          const typeIn = (span, text, t0, t1) => {
            fade($('#ph'), 1, 0, t0 - 0.12, 0.12);
            fade($('#caret'), 0, 1, t0 - 0.12, 0.08);
            LF.type(tl, span, text, t0, t1 - t0 - 0.18);
            tl.set(span, { display: 'none' }, t1);
            fade($('#caret'), 1, 0, t1, 0.06);
            fade($('#ph'), 0, 1, t1 + 0.1, 0.25);
            tl.fromTo($('#send'), { scale: 1 }, { scale: 0.84, duration: 0.07, ease: 'power2.in', ...IR }, t1 - 0.08);
            tl.fromTo($('#send'), { scale: 0.84 }, { scale: 1, duration: 0.2, ease: 'back.out(3)', ...IR }, t1 - 0.01);
          };

          // ---------- the pointer: glides in, presses, leaves
          const cursor = $('#cursor'), ring = $('#ring');
          const press = (target, tIn, tPress, from = [-150, -80]) => {
            const b = target;
            const x = b.x + b.w * 0.55, y = b.y + b.h * 0.6;
            tl.fromTo(cursor, { opacity: 0 }, { opacity: 1, duration: 0.2, ...IR }, tIn);
            tl.fromTo(cursor, { x: x + from[0], y: y + from[1] }, { x, y, duration: tPress - tIn - 0.06, ease: 'power3.inOut', ...IR }, tIn);
            tl.fromTo(cursor, { scale: 1 }, { scale: 0.82, duration: 0.07, ease: 'power2.in', ...IR }, tPress);
            tl.fromTo(cursor, { scale: 0.82 }, { scale: 1, duration: 0.16, ease: 'power2.out', ...IR }, tPress + 0.07);
            tl.fromTo(ring, { scale: 0.3, opacity: 0.9 }, { scale: 1.7, opacity: 0, duration: 0.45, ease: 'power2.out', ...IR }, tPress);
            tl.fromTo(cursor, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: 'power1.in', ...IR }, tPress + 0.45);
          };
          const pressed = (el, t) => {
            tl.fromTo(el, { scale: 1 }, { scale: 0.92, duration: 0.07, ease: 'power2.in', ...IR }, t);
            tl.fromTo(el, { scale: 0.92 }, { scale: 1, duration: 0.2, ease: 'back.out(3)', ...IR }, t + 0.07);
          };

          // ---------- the panel's pages and the rail
          const rs = $('#rail-sel');
          const rb = { today: box($('#rail-today')), goals: box($('#rail-goals')) };
          const railBox = box($('nav[aria-label="Main"]'));
          Object.assign(rs.style, { left: rb.today.x - railBox.x + 'px', top: rb.today.y - railBox.y + 'px', width: rb.today.w + 'px', height: rb.today.h + 'px' });
          let place = 'today';
          const ink = (el, on) => (el.style.color = on ? 'rgb(var(--ink))' : '');
          ink($('#rail-today'), true);
          const railTo = (to, t) => {
            if (to === place) return;
            tl.fromTo(rs, { y: rb[place].y - rb.today.y }, { y: rb[to].y - rb.today.y, duration: 0.38, ease: 'power3.inOut', ...IR }, t);
            tl.set($('#rail-' + place), { color: '' }, t + 0.15);
            tl.set($('#rail-' + to), { color: 'rgb(var(--ink))' }, t + 0.15);
            place = to;
          };
          /** A page of the panel replaces another: the old one fades, the new one rises in. `cut` swaps at once. */
          const page = (from, to, t, cut = false) => {
            if (cut) {
              tl.fromTo($(to), { opacity: 0 }, { opacity: 1, duration: 0.01, ...IR }, t);
              tl.fromTo($(from), { opacity: 1 }, { opacity: 0, duration: 0.01, ...IR }, t + 0.01);
              return;
            }
            fade($(from), 1, 0, t, 0.2, 'power1.in');
            tl.fromTo($(to), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out', ...IR }, t + 0.1);
          };
          /** An element grows from nothing to its height. */
          const grow = (el, t, d = 0.5) => {
            const h = el.offsetHeight;
            el.style.overflow = 'hidden';
            tl.fromTo(el, { height: 0, opacity: 0 }, { height: h, opacity: 1, duration: d, ease: 'power3.out', ...IR }, t);
            tl.set(el, { height: 'auto' }, t + d + 0.01);
          };
          /** A HUD replaces the one under it: the new bar's text rises in. */
          let hudNow = '#hud-a';
          const hudIn = (sel, t) => {
            const h = $(sel);
            fade(h, 0, 1, t, 0.22);
            fade($(hudNow), 1, 0, t + 0.24, 0.01);
            hudNow = sel;
            tl.fromTo(h.querySelector('.min-w-0.flex-1') ?? h, { y: 10 }, { y: 0, duration: 0.45, ease: 'power3.out', ...IR }, t);
          };

          // ======================================================== 1 · the ask
          shot(0, 0.01, { cx: 433, cy: 655, s: 1.72 });
          tl.fromTo($('#hello'), { opacity: 1, y: 0 }, { opacity: 0, y: -12, duration: 0.25, ease: 'power1.in', ...IR }, T.send1 - 0.05);
          typeIn($('#ty-ask'), C.ask, T.ask0, T.send1);
          join($('#m-ask'), T.send1);
          shot(T.send1 - 0.05, 0.6, { cx: 520, cy: 330, s: 1.42 });

          // ======================================================== 2 · it looks it up, and lays out a plan
          join($('#m-search'), T.search);
          $$('#m-search a').forEach((a, i) => tl.fromTo(a, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: 'power3.out', ...IR }, T.search + 0.3 + i * 0.17));
          $$('#m-search a').forEach((a) => (a.style.opacity = '0'));
          join($('#m-answer'), T.ans0);
          const words = LF.words($('#m-answer > div:first-child'));
          LF.stream(tl, words, T.ans0 + 0.1, T.ans1 - T.ans0 - 0.1);
          // the list follows the lines as they are written
          const step = (T.ans1 - T.ans0 - 0.1) / words.length;
          let lineTop = -1;
          words.forEach((w, i) => {
            const b = box(w);
            if (Math.abs(b.y - lineTop) < 4) return;
            lineTop = b.y;
            const y = need(b.y + b.h + 34);
            if (y > scrolled) scrollTo(T.ans0 + 0.1 + i * step, y, 0.35, 'power2.out');
          });
          // the camera keeps the newest lines in view
          shot(T.ans0, T.ans1 - T.ans0, { cx: 520, cy: 470, s: 1.42 }, 'sine.inOut');
          // the three phases of the plan light up as they are written
          $$('#m-answer li').forEach((li) => {
            const t0 = T.ans0 + 0.1 + words.indexOf(li.querySelector('.w')) * step;
            li.classList.add('pre');
            LF.cls(tl, li, 'pre', false, t0);
            tl.fromTo(li, { backgroundColor: 'rgba(124,120,242,0)' }, { backgroundColor: 'rgba(124,120,242,0.14)', duration: 0.25, ...IR }, t0);
            tl.fromTo(li, { backgroundColor: 'rgba(124,120,242,0.14)' }, { backgroundColor: 'rgba(124,120,242,0)', duration: 0.9, ...IR }, t0 + 0.9);
            li.style.borderRadius = '6px';
          });

          // ======================================================== 3 · the yes: the roadmap waits on "Do it"
          shot(T.rep0 - 0.25, 0.55, { cx: 520, cy: 560, s: 1.42 });
          typeIn($('#ty-reply'), C.reply, T.rep0, T.send2);
          join($('#m-reply'), T.send2);
          join($('#sw1'), T.card);
          tl.fromTo($('#card1'), { scale: 0.97 }, { scale: 1, duration: 0.5, ease: 'back.out(2)', ...IR }, T.card + 0.04);
          const card1 = inChat($('#card1'), scrolled);
          const do1 = inChat($('#card1-do'), scrolled);
          shot(T.card + 0.15, 0.7, frame(card1, 0.86, 2.1));
          press(do1, T.cur1, T.do1, [-170, -110]);
          pressed($('#card1-do'), T.do1);
          // done: the card folds into its row
          const fold = (n, t) => {
            tl.fromTo(sw[n], { height: tall[n] }, { height: short[n], duration: 0.42, ease: 'power3.inOut', ...IR }, t);
            fade($('#card' + n), 1, 0, t, 0.2);
            fade($('#row' + n), 0, 1, t + 0.15, 0.25);
          };
          fold(1, T.do1 + 0.2);
          scrollTo(T.do1 + 0.2, need(bottomOf($('#sw1'), 1)), 0.42, 'power3.inOut');
          join($('#m-done'), T.done, 1);
          shot(T.done, 0.6, { cx: 520, cy: 520, s: 1.42 });

          // ======================================================== 4 · on the calendar: the HUD and Today take it in
          shot(T.out, 0.8, { cx: 720, cy: 450, s: 1.0 });
          hudIn('#hud-b', T.hudB);
          page('#p-today0', '#p-today1', T.hudB, true);
          grow($('#t1-row'), T.hudB + 0.05, 0.5);
          tl.fromTo($('#t1-row'), { backgroundColor: 'rgb(var(--accent) / 0.12)' }, { backgroundColor: 'rgb(var(--accent) / 0)', duration: 1.2, ...IR }, T.hudB + 0.5);
          tl.fromTo($('#t1-coming'), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out', ...IR }, T.coming);
          $('#t1-coming').style.opacity = '0';
          $$('#t1-coming ol > li').forEach((li, i) => tl.fromTo(li, { opacity: 0, x: 10 }, { opacity: 1, x: 0, duration: 0.3, ease: 'power2.out', ...IR }, T.coming + 0.1 + i * 0.07));

          // ======================================================== 5 · the roadmap, and what a session holds
          press(rb.goals, T.cur3, T.goals, [-260, 120]);
          pressed($('#rail-goals'), T.goals);
          railTo('goals', T.goals);
          page('#p-today1', '#p-goals0', T.goals);
          const rmBox = box($('#p-goals1 article'));
          shot(T.goals + 0.1, 0.8, { cx: rmBox.x + rmBox.w / 2 - 20, cy: 560, s: 1.55 });
          const tg = box($('#g0-toggle'));
          press(tg, T.cur4, T.toggle, [-200, -90]);
          pressed($('#g0-toggle'), T.toggle);
          page('#p-goals0', '#p-goals1', T.toggle + 0.05, true);
          grow($('#g1-notes'), T.toggle + 0.06, 0.55);
          $$('#g1-notes li').forEach((li, i) => tl.fromTo(li, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out', ...IR }, T.toggle + 0.25 + i * 0.09));
          $$('#g1-notes a').forEach((a, i) => tl.fromTo(a, { backgroundColor: 'rgb(var(--accent) / 0)' }, { backgroundColor: 'rgb(var(--accent) / 0.18)', duration: 0.2, yoyo: true, repeat: 1, ...IR }, T.toggle + 0.9 + i * 0.25));
          const notes = box($('#g1-notes'));
          shot(T.toggle + 0.2, 0.7, { cx: rmBox.x + rmBox.w / 2 - 10, cy: Math.min(notes.y + notes.h / 2 + 40, 610), s: 1.75 });

          // ======================================================== 6 · nine o'clock: it runs
          railTo('today', T.run);
          page('#p-goals1', '#p-run', T.run);
          hudIn('#hud-run', T.run + 0.05);
          fade($('#rail-dot'), 0, 1, T.run + 0.2, 0.2);
          shot(T.run - 0.1, 0.8, { cx: 626, cy: 391, s: 1.15 });
          LF.count(tl, $('#run-timer'), 0, 660, T.timer0, T.timer1 - T.timer0, (n) => `${Math.floor(n / 60)}:${String(Math.floor(n % 60)).padStart(2, '0')}`, 'power1.inOut');
          const est = parseFloat($('#run-tick').style.left) || 80;
          const overW = $('#run-over').style.width;
          $('#run-line').style.width = '0%';
          $('#run-over').style.width = '0%';
          $('#run-timer').textContent = '0:00';
          $('#hud-tp').textContent = '0';
          $('#hud-pct').textContent = '0%';
          tl.fromTo($('#run-line'), { width: '0%' }, { width: est + '%', duration: (T.timer1 - T.timer0) * 0.93, ease: 'power1.inOut', ...IR }, T.timer0);
          tl.fromTo($('#run-over'), { width: '0%' }, { width: overW, duration: 0.3, ease: 'power1.out', ...IR }, T.timer1 - 0.12);
          fade($('#run-note'), 0, 1, T.timer1, 0.3);
          $('#run-note').style.opacity = '0';
          $$('#run-card li').forEach((li, i) => tl.fromTo(li, { opacity: 0, x: 8 }, { opacity: 1, x: 0, duration: 0.3, ease: 'power2.out', ...IR }, T.run + 0.35 + i * 0.08));
          // the live dot breathes, a few times
          for (let t = T.run + 0.3; t < T.earn - 0.6; t += 1.3) tl.fromTo($('#run-ring'), { scale: 1, opacity: 0.7 }, { scale: 3, opacity: 0, duration: 1.1, ease: 'power2.out', ...IR }, t);

          // ======================================================== 7 · closed in a sentence
          shot(T.close0 - 0.3, 0.6, { cx: 520, cy: 560, s: 1.42 });
          typeIn($('#ty-close'), C.close, T.close0, T.send3);
          join($('#m-close'), T.send3, 1);
          join($('#sw2'), T.ccard, 1);
          tl.fromTo($('#card2'), { scale: 0.97 }, { scale: 1, duration: 0.5, ease: 'back.out(2)', ...IR }, T.ccard + 0.04);
          const card2 = inChat($('#card2'), scrolled, 1);
          const do2 = inChat($('#card2-do'), scrolled, 1);
          shot(T.ccard + 0.1, 0.6, frame(card2, 0.8, 2.1));
          press(do2, T.cur2, T.do2, [-160, -100]);
          pressed($('#card2-do'), T.do2);
          fold(2, T.do2 + 0.15);
          scrollTo(T.do2 + 0.15, need(bottomOf($('#sw2'), 2)), 0.42, 'power3.inOut');
          join($('#m-closed'), T.earn + 0.3, 2);
          // the day takes the session: the bar shows what comes next, the tempos count up, the log keeps it
          shot(T.earn, 0.8, { cx: 626, cy: 391, s: 1.15 });
          hudIn('#hud-c', T.earn + 0.1);
          fade($('#rail-dot'), 1, 0, T.earn + 0.1, 0.2);
          LF.count(tl, $('#hud-tp'), 0, 13, T.earn + 0.25, 0.9);
          LF.count(tl, $('#hud-pct'), 0, 13, T.earn + 0.25, 0.9, (n) => Math.round(n) + '%');
          const tp = $('#hud-tp').closest('a');
          tl.fromTo(tp, { scale: 1 }, { scale: 1.18, duration: 0.18, ease: 'power2.out', ...IR }, T.earn + 0.25);
          tl.fromTo(tp, { scale: 1.18 }, { scale: 1, duration: 0.5, ease: 'back.out(3)', ...IR }, T.earn + 0.43);
          page('#p-run', '#p-today2', T.earn + 0.05);
          grow($('#t2-log'), T.earn + 0.12, 0.5);
          const plus = $('#t2-log span.rounded');
          tl.fromTo(plus, { scale: 0.5 }, { scale: 1, duration: 0.45, ease: 'back.out(3)', ...IR }, T.earn + 0.5);

          // ======================================================== 8 · ten weeks, one continuous animation
          railTo('goals', T.goals2);
          page('#p-today2', '#p-goals2', T.goals2);
          const rm = box($('#rm'));
          shot(T.goals2 + 0.1, 0.85, { cx: rm.x + rm.w / 2 + 40, cy: rm.y + 215, s: 1.85 });
          const pill = $('#date');
          pill.style.left = rm.x + rm.w - pill.offsetWidth - 18 + 'px';
          pill.style.top = rm.y - 15 + 'px';
          tl.fromTo(pill, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out', ...IR }, T.lapse0 - 0.45);

          const S = D.sessions, N = S.length, P = D.phases;
          const start = [0, 10, 30];
          const subH = $('#st-sub-0').offsetHeight;
          const fromH = $('#st-from-1').offsetHeight;
          const set = (el, cls, text) => {
            if (el.className !== cls) el.className = cls;
            if (text !== undefined && el.textContent !== text) el.textContent = text;
          };
          const day0 = new Date(S[0].date + 'T12:00:00Z');
          const st = { i: 1 };
          const paint = () => {
            const i = clamp(st.i, 1, N + 1.4);
            const k = Math.min(N, Math.floor(i + 1e-6)); // sessions done
            const pct = k >= N ? 100 : S[k - 1].pct + (S[Math.min(N - 1, k)].pct - S[k - 1].pct) * (i - k);
            $('#rm-pct').textContent = String(Math.round(pct));
            const last = S[k - 1];
            $('#date-d').textContent = last.label;
            $('#date-w').textContent = 'Week ' + (Math.floor((new Date(last.date + 'T12:00:00Z') - day0) / 864e5 / 7) + 1);
            let reached = 0;
            P.forEach((p, j) => {
              const doneJ = k >= p.until, cur = !doneJ && k >= start[j];
              if (doneJ) reached++;
              const part = clamp((i - start[j]) / p.total, 0, 1);
              $('#seg-' + j).style.width = part * 100 + '%';
              $('#st-bar-' + j).style.width = part * 100 + '%';
              // the step's circle: its number, the accent while it runs, the ink and a check once reached
              set($('#st-n-' + j), 'tabular relative mt-0.5 flex size-[23px] shrink-0 items-center justify-center rounded-full text-xs font-semibold ' + (doneJ ? 'bg-ink text-canvas' : cur ? 'bg-accent-fill text-white' : 'border border-line-strong bg-panel text-ink-3'));
              $('#st-num-' + j).style.opacity = doneJ ? '0' : '1';
              const ok = $('#st-ok-' + j);
              const pop = clamp((i - p.until) / 1.2, 0, 1);
              ok.style.opacity = doneJ ? '1' : '0';
              ok.style.transform = `scale(${doneJ ? 0.4 + 0.6 * gsap.parseEase('back.out(3)')(pop) : 0.4})`;
              const line = $('#st-line-' + j);
              if (line) line.className = 'absolute bottom-0 left-[11px] top-7 w-px ' + (doneJ ? 'bg-ink-3' : 'bg-line');
              set($('#st-h-' + j), 'text-md font-semibold ' + (cur || doneJ ? 'text-ink' : 'text-ink-2'));
              set($('#st-tag-' + j), cur ? 'text-sm font-medium text-accent-ink' : 'text-sm text-ink-3', doneJ ? 'Reached on ' + p.reached : cur ? 'You are here' : 'Later');
              set($('#st-act-' + j), 'min-w-0 flex-1 truncate text-base ' + (cur ? 'text-ink' : 'text-ink-2'));
              const n = clamp(k - start[j], 0, p.total);
              set($('#st-cnt-' + j), 'tabular shrink-0 text-sm ' + (cur ? 'font-medium text-ink' : doneJ ? 'text-ink-2' : 'text-ink-3'), cur || doneJ ? `${n} of ${p.total} sessions` : `${p.total} sessions`);
              // the progress line shows on the step that runs; it opens and closes over one session
              const open = clamp(i - start[j] + (j === 0 ? 1 : 0), 0, 1) * clamp(p.until + 1 - i, 0, 1);
              const sub = $('#st-sub-' + j);
              sub.style.height = subH * gsap.parseEase('power2.inOut')(open) + 'px';
              sub.style.opacity = String(open);
              if (cur) $('#st-next-' + j).textContent = `Next: ${S[k].label} · 09:00 · ${p.until - k} planned`;
              const from = $('#st-from-' + j);
              if (from) {
                const show = clamp(start[j] - i + 1, 0, 1);
                from.style.height = fromH * gsap.parseEase('power2.inOut')(show) + 'px';
                from.style.opacity = String(show);
              }
            });
            const steps = $('#rm-steps');
            if (k >= N) {
              if (steps.dataset.goal !== '1') {
                steps.className = 'inline-flex items-center gap-1 font-medium text-success';
                steps.innerHTML = GOAL;
                steps.dataset.goal = '1';
              }
            } else {
              if (steps.dataset.goal === '1' || steps.textContent !== `${reached} of 3 steps`) {
                steps.className = '';
                steps.textContent = `${reached} of 3 steps`;
                steps.dataset.goal = '0';
              }
            }
          };
          tl.fromTo(st, { i: 1 }, { i: 1, duration: 0.01, onUpdate: paint, ...IR }, T.goals2);
          tl.fromTo(st, { i: 1 }, { i: N + 1.4, duration: T.lapse1 - T.lapse0 + 0.5, ease: 'sine.inOut', onUpdate: paint, ...IR }, T.lapse0);
          // goal reached: the number lands, the line under the title says it
          const pctEl = $('#rm-pct').parentElement;
          tl.fromTo(pctEl, { scale: 1 }, { scale: 1.14, duration: 0.18, ease: 'power2.out', ...IR }, T.lapse1);
          tl.fromTo(pctEl, { scale: 1.14 }, { scale: 1, duration: 0.55, ease: 'back.out(3)', ...IR }, T.lapse1 + 0.18);
          tl.fromTo($('#rm-steps'), { scale: 0.8 }, { scale: 1, duration: 0.5, ease: 'back.out(3)', ...IR }, T.lapse1 + 0.02);
          shot(T.lapse1 + 0.1, 1.4, { cx: rm.x + rm.w / 2 + 40, cy: rm.y + 215, s: 1.68 }, 'power2.inOut');

          paintCam();
          paint();
          window.__timelines['app'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
