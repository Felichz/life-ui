<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <div id="end" data-composition-id="end" data-width="1920" data-height="1200">
        <style>
          #end { position: absolute; inset: 0; background: rgb(var(--canvas)); }
          #end .endc { position: absolute; left: 0; right: 0; top: 380px; display: flex; flex-direction: column; align-items: center; color: rgb(var(--ink)); }
          #end .endc-mark { width: 104px; height: 104px; opacity: 0; }
          #end .endc-name { margin-top: 30px; font-size: 76px; line-height: 1.1; font-weight: 700; letter-spacing: -0.035em; opacity: 0; }
          #end .endc-tag { margin-top: 10px; font-size: 34px; line-height: 1.3; color: rgb(var(--ink-2)); letter-spacing: -0.01em; opacity: 0; }
          #end .endc-url { margin-top: 36px; font-size: 30px; line-height: 1.3; font-weight: 600; color: rgb(var(--accent-ink)); opacity: 0; }
        </style>
        <div class="endc">
          <svg class="endc-mark" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#5854D6" /><circle cx="15.5" cy="15.5" r="7.5" fill="none" stroke="#fff" stroke-width="3" /><path d="M15.5 8a7.5 7.5 0 0 1 7.5 7.5h-7.5z" fill="#fff" /><path d="M20 20l4.5 4.5" stroke="#F5B544" stroke-width="3" stroke-linecap="round" /></svg>
          <div class="endc-name">LifeUI</div>
          <div class="endc-tag">Your personal assistant and coach, built around you.</div>
          <div class="endc-url">lifeui.medanolabs.com</div>
        </div>
      </div>
      <script>
        (() => {
          // the card after the film: the product, the line the site uses for it, and where to get it
          const IR = LF.IR;
          const root = document.querySelector('#el-end [data-composition-id="end"]') ?? document.querySelector('[data-composition-id="end"]:not([data-composition-src])');
          const $ = (s) => root.querySelector(s);
          const tl = gsap.timeline({ paused: true });
          // after the 0.6 s cross-fade from the film
          tl.fromTo($('.endc-mark'), { opacity: 0, y: 14, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: 'power3.out', ...IR }, 0.35);
          tl.fromTo($('.endc-name'), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out', ...IR }, 0.45);
          tl.fromTo($('.endc-tag'), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out', ...IR }, 0.62);
          tl.fromTo($('.endc-url'), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out', ...IR }, 0.8);
          window.__timelines['end'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
