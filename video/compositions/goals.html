ecoration-line-strong underline-offset-2 hover:text-ink">Tennis elbow (University Hospitals Plymouth, NHS)<span class="text-ink-3"> · plymouthhospitals.nhs.uk</span></a><a href="https://rightdecisions.scot.nhs.uk/media/je5g5qzk/tennis-elbow-exercise-booklet.pdf" target="_blank" rel="noreferrer" class="truncate text-xs text-ink-2 underline decoration-line-strong underline-offset-2 hover:text-ink">Tennis elbow exercise booklet (NHS Right Decisions)<span class="text-ink-3"> · rightdecisions.scot.nhs.uk</span></a><a href="https://osha.gov/etools/computer-workstations/additional-information" target="_blank" rel="noreferrer" class="truncate text-xs text-ink-2 underline decoration-line-strong underline-offset-2 hover:text-ink">Computer workstations (OSHA)<span class="text-ink-3"> · osha.gov</span></a></span></span></li></ul><div class="group/message flex flex-col gap-1 pr-2 animate-entry-in"><div class="text-base leading-relaxed text-ink"><p class="[&amp;:not(:first-child)]:mt-2">I'm not a doctor and this isn't a diagnosis, but pain on the outside of the elbow of the mouse arm is the classic overload pattern, and the NHS guides agree on what helps.</p>
<p class="[&amp;:not(:first-child)]:mt-2"><strong class="font-semibold text-ink">Change today:</strong> elbow near 90°, the mouse close, the Mac raised with an external keyboard and mouse, a short break every 30 to 45 minutes.</p>
<p class="[&amp;:not(:first-child)]:mt-2"><strong class="font-semibold text-ink">A 10-week plan, about 10 minutes a session</strong> (most people improve in 8 to 12 weeks):</p>
<ol class="mt-2 list-decimal space-y-1 pl-5 marker:text-ink-3">
<li class="pl-0.5"><strong class="font-semibold text-ink">Weeks 1–2, calm it down:</strong> isometric wrist hold 5 × 30 s, forearm stretch 3 × 10 s.</li>
<li class="pl-0.5"><strong class="font-semibold text-ink">Weeks 3–6, load it:</strong> eccentric wrist extension 3 × 15 with a 0.5 L bottle.</li>
<li class="pl-0.5"><strong class="font-semibold text-ink">Weeks 7–10, make it strong:</strong> the same with 1–2 kg, plus grip 3 × 10.</li>
</ol>
<p class="[&amp;:not(:first-child)]:mt-2">Every session will carry the link to the guide that shows its exercises. See a physio first if you have tingling, pain at night or swelling.</p>
<p class="[&amp;:not(:first-child)]:mt-2">Which days, and at what time?</p></div><div class="flex h-6 items-center gap-0.5 transition-opacity duration-150 focus-within:opacity-100 group-hover/message:opacity-100 coarse:opacity-100 opacity-0 -ml-1.5 justify-start"><button type="button" aria-label="Copy" class="flex size-6 items-center justify-center rounded text-ink-3 transition-colors duration-150 hover:bg-hover hover:text-ink coarse:size-9 [&amp;_svg]:size-3.5" data-state="closed"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg></button><button type="button" aria-label="Continue from here in another conversation" class="flex size-6 items-center justify-center rounded text-ink-3 transition-colors duration-150 hover:bg-hover hover:text-ink coarse:size-9 [&amp;_svg]:size-3.5" data-state="closed"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-git-branch"><line x1="6" x2="6" y1="3" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg></button></div></div><div class="group/message mt-3 flex flex-col items-end gap-1 first:mt-0 animate-entry-in"><div class="max-w-[88%] rounded-lg rounded-br-sm bg-hover px-3 py-2 text-base text-ink"><p class="whitespace-pre-wrap">Weekdays at 9, before work. No tingling. Go ahead.</p></div><div class="flex h-6 items-center gap-0.5 transition-opacity duration-150 focus-within:opacity-100 group-hover/message:opacity-100 coarse:opacity-100 opacity-0 justify-end"><button type="button" aria-label="Copy" class="flex size <p class="[&amp;:not(:first-child)]:mt-2"><strong class="font-semibold text-ink">Change today:</strong> elbow near 90°, the mouse close, the Mac raised with an external keyboard and mouse, a short break every 30 to 45 minutes.</p>
<p class="[&amp;:not(:first-child)]:mt-2"><strong class="font-semibold text-ink">A 10-week plan, about 10 minutes a session</strong> (most people improve in 8 to 12 weeks):</p>
<ol class="mt-2 list-decimal space-y-1 pl-5 marker:text-ink-3">
<li class="pl-0.5"><strong class="font-semibold text-ink">Weeks 1–2, calm it down:</strong> isometric wrist hold 5 × 30 s, forearm stretch 3 × 10 s.</li>
<li class="pl-0.5"><strong class="font-semibold text-ink">Weeks 3–6, load it:</strong> eccentric wrist extension 3 × 15 with a 0.5 L bottle.</li>
<li class="pl-0.5"><strong class="font-semibold text-ink">Weeks 7–10, make it strong:</strong> the same with 1–2 kg, plus grip 3 × 10.</li>
</ol>
<p class="[&amp;:not(:first-child)]:mt-2">Every session will carry the link to the guide that shows its exercises. See a physio first if you have tingling, pain at night or swelling.</p>
