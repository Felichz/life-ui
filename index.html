<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="LifeUI: a HUD for your real day. Plan, focus on one thing at a time and close it honestly."
    />
    <meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)" />
    <title>LifeUI</title>
    <script>
      // Tema e idioma antes del primer pintado (evita el destello).
      (function () {
        var pref = "system";
        var locale = "en";
        try {
          pref =
            localStorage.getItem("lifeui.theme") ||
            localStorage.getItem("qualia.theme") ||
            "system";
          var saved = localStorage.getItem("lifeui.locale");
          if (saved === "es" || saved === "en") locale = saved;
        } catch (e) {}
        document.documentElement.lang = locale;
        var dark =
          pref === "dark" ||
          (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
